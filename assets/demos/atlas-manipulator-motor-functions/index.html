<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Atlas Manipulator — Basic Motor Functions</title>
<style>
  :root{
    --orange-hot:#e3711f; --orange-body:#9c3814;
    --ink:#211e19; --sub:#6b665c;
    --panel-ink:#efe9df; --panel-sub:#9a9284;
    --panel-bg:rgba(20,18,15,.88); --panel-border:#3a352c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#f6f5f2;overflow:hidden;}
  body{font-family:'Courier New', ui-monospace, monospace; color:var(--ink);}
  #wrap{position:relative; width:100vw; height:100vh;}
  canvas{display:block;}

  .hud{ position:absolute; left:5vmin; top:5vmin; z-index:5; max-width:46vmin; pointer-events:none; }
  .hud .brand{
    font-size:clamp(20px,3.6vmin,40px); letter-spacing:.14em; font-weight:700;
    color:var(--ink); text-transform:uppercase; margin:0 0 .5vmin 0;
  }
  .hud .rule{ width:9vmin; height:3px; background:linear-gradient(90deg,var(--orange-hot),var(--orange-body) 70%,transparent); margin:.6vmin 0 1vmin 0; }
  .hud .sub{
    font-size:clamp(10px,1.3vmin,14px); letter-spacing:.2em;
    color:var(--sub); text-transform:uppercase; line-height:1.7;
  }

  .panel{
    position:absolute; right:5vmin; bottom:5vmin; z-index:5; width:min(80vmin,340px);
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:6px;
    padding:1.7vmin 1.9vmin; backdrop-filter:blur(8px);
    box-shadow:0 1vmin 3vmin rgba(30,25,15,.18);
  }
  .panel-header{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:.6vmin;
  }
  .panel-header .title{
    font-size:clamp(10px,1.25vmin,14px); letter-spacing:.16em; text-transform:uppercase;
    color:var(--panel-ink); font-weight:700;
  }
  .min-btn{
    width:2.4vmin; height:2.4vmin; min-width:20px; min-height:20px;
    font-family:inherit; font-size:14px; line-height:1; color:var(--panel-ink);
    background:#211e19; border:1px solid #453f34; border-radius:3px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .min-btn:hover{ border-color:var(--orange-hot); }
  .panel-instr{
    font-size:clamp(9px,1.02vmin,12px); letter-spacing:.02em; line-height:1.55;
    color:var(--panel-sub); margin-bottom:1.6vmin; text-transform:none;
  }
  .panel.collapsed .panel-header{ margin-bottom:0; }
  .panel.collapsed .panel-instr,
  .panel.collapsed .row{ display:none; }
  .panel .row{ margin-bottom:1.5vmin; }
  .panel .row:last-child{ margin-bottom:0; }
  .panel .label{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:clamp(9px,1.05vmin,12px); letter-spacing:.14em; text-transform:uppercase;
    color:var(--panel-sub); margin-bottom:.7vmin;
  }
  .panel .label b{ color:var(--panel-ink); font-weight:700; }
  .panel .label .val{ color:var(--orange-hot); font-weight:700; }

  input[type="range"]{
    -webkit-appearance:none; appearance:none; width:100%; height:3px;
    background:#3a352c; border-radius:2px; outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:15px; height:15px; border-radius:50%;
    background:var(--orange-hot); border:2px solid #14120f; box-shadow:0 1px 4px rgba(0,0,0,.6); cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%; background:var(--orange-hot);
    border:2px solid #14120f; box-shadow:0 1px 4px rgba(0,0,0,.6); cursor:pointer;
  }

  .btnrow{ display:flex; gap:.8vmin; flex-wrap:wrap; }
  .btn{
    flex:1; min-width:5.5rem; font-family:inherit; font-size:clamp(9px,1.05vmin,12px);
    letter-spacing:.1em; text-transform:uppercase; color:var(--panel-ink);
    background:#1c1914; border:1px solid #453f34; border-radius:3px; padding:.9vmin .6vmin;
    cursor:pointer; transition:all .15s ease;
  }
  .btn:hover{ border-color:var(--orange-hot); }
  .btn.locked, .btn.active{ background:var(--orange-hot); border-color:var(--orange-hot); color:#14120f; }
  .btn.wide{ flex-basis:100%; }
  .btn.wide.open{ background:var(--orange-hot); border-color:var(--orange-hot); color:#14120f; }

  .footer{
    position:absolute; left:5vmin; bottom:3vmin; text-align:left; z-index:5; pointer-events:none;
    font-size:clamp(9px,1.05vmin,12px); letter-spacing:.18em; text-transform:uppercase; color:#a7a196;
  }
  .footer b{ color:var(--orange-hot); }
</style>
</head>
<body>
  <div id="wrap">
    <div class="hud">
      <div class="brand">Atlas Manipulator</div>
      <div class="rule"></div>
      <div class="sub">Basic motor functions — manual control</div>
    </div>

    <div class="panel" id="panel">
      <div class="panel-header">
        <span class="title">Controls</span>
        <button class="min-btn" id="panel-min" aria-label="Minimise controls" title="Minimise">&#8722;</button>
      </div>
      <div class="panel-instr">Resize segments &middot; swivel the base &middot; lock a joint mid-cycle &middot; claw eases open slowly.</div>
      <div class="row">
        <div class="label"><b>Segment length</b><span class="val" id="val-length">100%</span></div>
        <input type="range" id="ctl-length" min="65" max="140" step="1" value="100">
      </div>
      <div class="row">
        <div class="label"><b>Base swivel</b><span class="val" id="val-swivel">0°</span></div>
        <input type="range" id="ctl-swivel" min="-90" max="90" step="1" value="0">
      </div>
      <div class="row">
        <div class="label"><b>Segment lock</b></div>
        <div class="btnrow">
          <button class="btn" id="lock-shoulder" data-joint="shoulder">Upper arm</button>
          <button class="btn" id="lock-elbow" data-joint="elbow">Forearm</button>
          <button class="btn" id="lock-wrist" data-joint="wrist">Wrist</button>
        </div>
      </div>
      <div class="row">
        <div class="label"><b>Claw</b></div>
        <div class="btnrow">
          <button class="btn wide" id="ctl-claw">Open claw</button>
        </div>
      </div>
      <div class="row">
        <div class="label"><b>Speed</b></div>
        <div class="btnrow">
          <button class="btn speed-btn" id="speed-slow" data-speed="0.5">Slow</button>
          <button class="btn speed-btn active" id="speed-normal" data-speed="1">Normal</button>
          <button class="btn speed-btn" id="speed-fast" data-speed="2">Fast</button>
        </div>
      </div>
    </div>

    <div class="footer">Unlocked segments cycling <b>&bull;</b> loop</div>
  </div>
<script src="three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
